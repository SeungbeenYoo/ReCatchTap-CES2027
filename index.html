<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCatch CES 2027 발표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
<style>
:root { --accent:#f98802; --ink:#1d1d1f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #030305; color: #f5f5f7; overflow: hidden; font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; word-break: keep-all; }
body.hide-cursor { cursor: none; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .28s ease; background: #030305; pointer-events: none; }
iframe.on { opacity: 1; z-index: 2; }
iframe.pre { z-index: 1; visibility: hidden; }
.hud { position: fixed; z-index: 10; pointer-events: none; transition: opacity .3s; }
.hud.off { opacity: 0; }
.brand { top: 22px; left: 26px; display: flex; align-items: center; gap: 10px; }
.brand img { width: 38px; height: 38px; border-radius: 10px; }
.brand b { font-size: 15px; font-weight: 900; display: block; }
.brand span { font-size: 11px; color: #9aa3b8; font-weight: 700; letter-spacing: .12em; }
.tag { top: 26px; right: 26px; font-size: 12px; font-weight: 900; letter-spacing: .14em; color: #cfd6ea; border: 1px solid rgba(255,255,255,.22); border-radius: 99px; padding: 6px 14px; background: rgba(0,0,0,.35); }
.tag b { color: var(--accent); }
.dots { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; opacity: .6; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); transition: all .3s; }
.dots i.on { background: var(--accent); width: 22px; border-radius: 6px; }
.again { position: fixed; right: 28px; bottom: 28px; z-index: 15; display: none; align-items: center; gap: 10px; font-family: inherit; font-size: 16px; font-weight: 800; line-height: 1; color: #fff; background: rgba(20,20,24,.82); border: 2px solid var(--accent); border-radius: 99px; padding: 14px 24px; cursor: pointer; }
.again.on { display: inline-flex; } .again svg { width: 18px; height: 18px; }
.again:hover, .again:focus-visible { background: var(--accent); color: var(--ink); outline: none; }

/* ── 시작 페이지 */
.start { position: fixed; inset: 0; z-index: 20; overflow: hidden; display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 4vw; padding: 7vh 7vw; background: #050507; }
.start { transition: opacity .9s ease, transform 1.1s cubic-bezier(.6,0,.2,1), filter .9s ease; }
.start.leaving { opacity: 0; transform: scale(1.08); filter: blur(6px); pointer-events: none; }
.start.gone { display: none; }
.start #go { transition: opacity .5s ease, transform .5s ease; }

.start::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 70% 45%, rgba(249,136,2,.30), rgba(249,136,2,0) 38%), radial-gradient(circle at 18% 90%, rgba(70,100,255,.16), rgba(0,0,0,0) 40%); animation: drift 14s ease-in-out infinite alternate; }
.start::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 6vh 6vh; mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 85%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 85%); }
@keyframes drift { to { transform: translate(-4%, 3%) scale(1.06); } }
.start > * { position: relative; z-index: 1; }
.st-l .prog { display: inline-flex; align-items: center; gap: 1vh; font-size: 2vh; font-weight: 800; border: .2vh solid rgba(249,136,2,.85); border-radius: 99px; padding: .9vh 2.2vh; background: rgba(0,0,0,.35); }
.st-l .prog i { font-style: normal; color: #ffb24d; }
.st-l .ces { margin-top: 4vh; font-size: 2vh; font-weight: 900; letter-spacing: .4em; color: #9fb3ff; }
.st-l h1 { margin-top: 1.6vh; font-size: 10vh; font-weight: 900; line-height: 1; letter-spacing: -.035em; }
.st-l h1 em { font-style: normal; color: var(--accent); }
.st-l .sub { margin-top: 2.4vh; font-size: 4.6vh; font-weight: 900; line-height: 1.15; letter-spacing: -.02em; }
.st-l .sub span { color: var(--accent); }
.st-l .desc { margin-top: 2vh; font-size: 2.2vh; color: #c9cdd8; line-height: 1.6; }
.st-l .team { margin-top: 4vh; display: flex; flex-wrap: wrap; gap: 1vh; }
.st-l .team b { font-size: 2.2vh; font-weight: 900; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 1.2vh; padding: 1vh 2vh; }
.st-l .row { margin-top: 5vh; display: flex; align-items: center; gap: 2.4vh; flex-wrap: wrap; }
.go { font-family: inherit; font-size: 2.6vh; font-weight: 900; line-height: 1; color: var(--ink); background: var(--accent); border: 0; border-radius: 99px; padding: 2.4vh 5vh; cursor: pointer; box-shadow: 0 0 0 0 rgba(249,136,2,.6); animation: pulse 2s infinite; }
.go:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
@keyframes pulse { 70% { box-shadow: 0 0 0 2.4vh rgba(249,136,2,0); } 100% { box-shadow: 0 0 0 0 rgba(249,136,2,0); } }
.ready { font-size: 1.8vh; color: #9aa3b8; } .ready b { color: #fff; }
.keys { margin-top: 2.4vh; font-size: 1.6vh; color: #8e94a6; line-height: 1.9; }
.keys kbd { font-family: inherit; font-weight: 800; color: #e6e8ee; border: 1px solid #4a5370; border-radius: 4px; padding: 0 6px; }
.st-r { display: flex; align-items: center; justify-content: center; }
.logo3d { position: relative; width: 38vh; height: 38vh; }
.logo3d img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 9vh; box-shadow: 0 4vh 12vh rgba(0,0,0,.7), 0 0 10vh rgba(249,136,2,.35); animation: float 5s ease-in-out infinite; }
.logo3d .ring { position: absolute; inset: -6vh; border-radius: 50%; border: .5vh solid rgba(249,136,2,.55); animation: spin 18s linear infinite; }
.logo3d .ring::before { content: ""; position: absolute; top: -1.2vh; left: 50%; width: 2.4vh; height: 2.4vh; border-radius: 50%; background: var(--accent); box-shadow: 0 0 3vh var(--accent); }
.logo3d .ring2 { inset: -11vh; border-color: rgba(159,179,255,.18); animation-duration: 30s; animation-direction: reverse; }
.logo3d .wm { position: absolute; left: 50%; bottom: -12vh; transform: translateX(-50%); font-size: 6vh; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; }
.logo3d .wm b { color: var(--accent); }
@keyframes float { 50% { transform: translateY(-1.6vh); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .start::before, .go, .logo3d img, .logo3d .ring { animation: none; } }
@media (max-width: 760px) { .start { grid-template-columns: 1fr; padding: 6vh 6vw; } .st-r { display: none; } .st-l h1 { font-size: 7vh; } }

/* ── 시작 페이지 (시안 1: 큰 R 리본) */
.start{display:block;padding:0;background:#18171c}
.start::before,.start::after{display:none}
.start .bigR{position:absolute;left:-3vw;top:0;height:100vh;width:auto}
.start .st-t{position:absolute;left:45vw;top:22vh;right:5vw}
.start .prog{display:inline-flex;align-items:center;gap:1vh;font-size:1.9vh;font-weight:800;border:.2vh solid rgba(249,136,2,.85);border-radius:99px;padding:.8vh 2vh;background:rgba(0,0,0,.35)}
.start .prog i{font-style:normal;color:#ffb24d}
.start .wmk{margin-top:4vh;display:flex;align-items:flex-end;gap:2vh;font:700 13vh/1 'Space Grotesk','Noto Sans KR',sans-serif;letter-spacing:-.04em;color:#fff}
.start .wmk svg{height:9vh;width:auto;margin-bottom:1.4vh} .start .wmk .ef{position:relative;display:inline-block;margin-right:.14em;padding:0 .06em} .start .wmk .ef svg{position:absolute;left:-.04em;right:-.04em;top:.2em;bottom:-.06em;width:calc(100% + .08em);height:auto;margin:0}
.start .wmk b{color:var(--accent)}
.start .slg{margin-top:3vh;font-size:5.4vh;font-weight:900;color:var(--accent);line-height:1.2}
.start .row{margin-top:6vh;display:flex;align-items:center;gap:3vh;flex-wrap:wrap}
.start .team{display:flex;gap:1vh;flex-wrap:wrap}
.start .team b{font-size:2vh;font-weight:800;border:1px solid rgba(255,255,255,.22);border-radius:1vh;padding:.8vh 1.8vh;background:rgba(255,255,255,.06)}
@media (max-width:760px){ .start .bigR{opacity:.25} .start .st-t{left:6vw;right:6vw} .start .wmk{font-size:9vh} }
.start .wmk .eb{font-style:normal;color:transparent;background:linear-gradient(90deg,#fff 0.000em 0.060em,transparent 0.060em 0.072em,#fff 0.072em 0.102em,transparent 0.102em 0.120em,#fff 0.120em 0.210em,transparent 0.210em 0.222em,#fff 0.222em 0.257em,transparent 0.257em 0.279em,#fff 0.279em 0.329em,transparent 0.329em 0.343em,#fff 0.343em 0.423em,transparent 0.423em 0.435em,#fff 0.435em 0.465em,transparent 0.465em 0.483em,#fff 0.483em 0.583em,transparent 0.583em 0.595em,#fff 0.595em 0.635em,transparent 0.635em 0.657em,#fff 0.657em 0.717em,transparent 0.717em 0.731em);background-size:0.731em 100%;-webkit-background-clip:text;background-clip:text}
</style>
</head>

<script>
(function(){
  var SCENES=[
    {src:'scene1.html',   tag:'SCENE <b>01</b> · ENTRANCE · 입장'},
    {src:'scene2.html',   tag:'SCENE <b>02</b> · WALK IN · 1인칭'},

  ];
  var N=SCENES.length, cur=-1, live=null, pre={}, started=false;
  var tag=document.getElementById('tag'), dotsEl=document.getElementById('dots'), again=document.getElementById('again'), readyEl=document.getElementById('ready');
  for (var i=0;i<N;i++) dotsEl.appendChild(document.createElement('i'));
  var dots=dotsEl.querySelectorAll('i');
  function hook(w){ try {
    w.addEventListener('keydown',function(e){ e.stopImmediatePropagation(); onKey(e); },true);
    w.addEventListener('keyup',function(e){ e.stopImmediatePropagation(); },true);
    w.addEventListener('click',function(e){ e.stopImmediatePropagation(); onClick(e, w.innerWidth); },true);
  } catch(err){} }
  function isReady(f){ try { return !!(f.contentWindow && f.contentWindow.__ready); } catch(e){ return false; } }
  // 미리 불러두기: 화면에는 안 보이고 일시정지 상태로 대기
  function preload(n){ if (n<0 || n>=N || pre[n]) return pre[n]; var f=document.createElement('iframe'); f.className='pre'; f.title='장면 '+(n+1); f.tabIndex=-1;
    f.onload=function(){ hook(f.contentWindow); updReady(); }; f.src=SCENES[n].src; document.body.appendChild(f); pre[n]=f; return f; }
  function updReady(){ var k=0; for (var i=0;i<N;i++) if (pre[i] && isReady(pre[i])) k++; if (!started && readyEl) readyEl.innerHTML = k>=2 ? '<b>준비 완료</b> · 장면 '+k+'/'+N+' 불러옴' : '장면 준비 중…'; }
  setInterval(updReady, 400);
  function show(n){
    if (n<0 || n>=N) return;
    var f=pre[n] || preload(n);
    var go=function(){
      if (!isReady(f)) { setTimeout(go, 40); return; }
      try { f.contentWindow.__start(); } catch(e){}
      f.classList.remove('pre'); f.classList.add('on');
      var old=live; live=f; delete pre[n]; cur=n;
      if (old && old!==f){ try { old.contentWindow.__paused=true; } catch(e){} setTimeout(function(){ if (old.parentNode) old.parentNode.removeChild(old); }, 320); }
      tag.innerHTML=SCENES[n].tag; dots.forEach(function(d,i){ d.classList.toggle('on', i===n); }); again.classList.toggle('on', n===N-1);
      try { f.contentWindow.focus(); } catch(e){}
      preload(n+1); if (n+2<N) setTimeout(function(){ preload(n+2); }, 1500);
    };
    go();
  }
  function replay(){ if (!live) return; try { live.contentWindow.__start(); } catch(e){} }
  function fs(){ var el=document.documentElement; if (!document.fullscreenElement){ if (el.requestFullscreen) el.requestFullscreen().catch(function(){}); } else if (document.exitFullscreen) document.exitFullscreen(); }
  function hud(on){ ['hb','tag','dots'].forEach(function(id){ document.getElementById(id).classList.toggle('off', !on); }); }
  var lockUntil=0, armed=false;
  function enterFs(){ var el=document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function(){}); }
  function arm(){ if (armed||started) return; armed=true; document.getElementById('start').classList.add('armed'); enterFs(); }
  function begin(){ if (started) return; started=true; armed=false; lockUntil=Date.now()+1600; var st=document.getElementById('start'); st.classList.remove('armed'); document.body.classList.add('hide-cursor'); enterFs(); show(0);
    setTimeout(function(){ st.classList.add('leaving'); hud(true); }, 350); setTimeout(function(){ st.classList.add('gone'); st.classList.remove('leaving'); }, 1500); }
  function restartAll(){ stopDoor(); started=false; armed=false; document.getElementById('start').classList.remove('armed'); cur=-1; if (live && live.parentNode) live.parentNode.removeChild(live); live=null;
    again.classList.remove('on'); tag.innerHTML=''; hud(false);
    document.getElementById('start').classList.remove('gone'); document.body.classList.remove('hide-cursor'); preload(0); preload(1); document.getElementById('go').focus(); }
  function onKey(e){ var k=e.key; if (e.repeat) { e.preventDefault(); return; }
    if (!started){ if (k===' '||k==='Enter'||k==='PageDown'||k==='ArrowRight'){ e.preventDefault(); if (armed) begin(); else arm(); } return; }
    if (k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'||k==='ArrowDown'){ e.preventDefault(); if (rdOpen()) return; if (cur===N-1) restartAll(); else show(cur+1); }
    else if (k==='ArrowLeft'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){ e.preventDefault(); show(cur-1); }
    else if (k==='r'||k==='R'){ replay(); }
    else if (k==='f'||k==='F'){ fs(); }
    else if (k==='Home'){ restartAll(); }
    else if (/^[1-7]$/.test(k)){ show(+k-1); }
  }
  // R 문 열림 사운드: sound/door.mp3 파일을 넣으면 문이 열릴 때 재생 (없으면 무음)
  //   #snd=12.5 → 12.5초 지점부터 재생, #sndlen=8 → 8초 뒤 페이드아웃
  var DOOR=(function(){ var a=new Audio(); a.preload='auto'; a.src='sound/door.mp3'; a.onerror=function(){ if (a.src.indexOf('.m4a')<0){ a.src='sound/door.m4a'; } else a.dead=true; }; return a; })();
  var SND_AT=parseFloat((location.hash.match(/snd=([\d.]+)/)||[])[1]||'0'), SND_LEN=parseFloat((location.hash.match(/sndlen=([\d.]+)/)||[])[1]||'0');
  var AC=null;
  function sfxDoor(){ try { if (!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); var c=AC, m=c.createGain(); m.gain.value=0.9; var cp=c.createDynamicsCompressor(); m.connect(cp); cp.connect(c.destination);
      var rv=c.createConvolver(), L=c.sampleRate*2, b=c.createBuffer(2,L,c.sampleRate); for (var ch=0;ch<2;ch++){ var d=b.getChannelData(ch); for (var i=0;i<L;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3); } rv.buffer=b; var rg=c.createGain(); rg.gain.value=0.45; rv.connect(rg); rg.connect(m);
      function env(g,t,v,a,d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
      function tone(t0,f,f2,type,d,v,lp,wet,a,lp2,det){ a=a||0.005; var t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain(), n=o; o.type=type; if (det) o.detune.value=det; o.frequency.setValueAtTime(f,t); if (f2) o.frequency.exponentialRampToValueAtTime(f2,t+0.5); if (lp){ var fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(lp,t); if (lp2) fl.frequency.exponentialRampToValueAtTime(lp2,t+a+d*0.6); o.connect(fl); n=fl; } n.connect(g); g.connect(m); if (wet){ var s=c.createGain(); s.gain.value=wet; g.connect(s); s.connect(rv); } env(g,t,v,a,d); o.start(t); o.stop(t+a+d+0.1); }
      function noise(t0,d,v,type,f,f2,q,a){ var t=c.currentTime+t0, n=Math.ceil(c.sampleRate*(d+0.1)), bb=c.createBuffer(1,n,c.sampleRate), x=bb.getChannelData(0); for (var i=0;i<n;i++) x[i]=Math.random()*2-1; var s=c.createBufferSource(); s.buffer=bb; var fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(f,t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d); var g=c.createGain(); env(g,t,v,a,d); s.connect(fl); fl.connect(g); g.connect(m); s.start(t); s.stop(t+d+0.1); }
      // 시안 01 · 시네마 타-둠
      function boom(t,f,v){ tone(t,f,38,'sine',1.1,v); noise(t,0.12,0.25,'lowpass',900,0,0.7,0.01); }
      boom(0,98,0.85); tone(0,196,0,'triangle',0.5,0.18,900); boom(0.42,82,1);
      [82,123,165,247].forEach(function(f,i){ tone(0.42,f,0,'sawtooth',2.2,0.07,1400,0.5,0.06,300,i*4); });
    } catch(e){} }
  function playDoor(){ if (DOOR.dead){ sfxDoor(); return; } try { DOOR.pause(); DOOR.currentTime=SND_AT; DOOR.volume=1; var pr=DOOR.play(); if (pr && pr.catch) pr.catch(function(){});
    if (SND_LEN>0){ clearInterval(DOOR._f); setTimeout(function(){ DOOR._f=setInterval(function(){ DOOR.volume=Math.max(0,DOOR.volume-0.05); if (DOOR.volume<=0){ clearInterval(DOOR._f); DOOR.pause(); } },60); }, SND_LEN*1000); } } catch(e){} }
  function stopDoor(){ try { clearInterval(DOOR._f); DOOR._f=setInterval(function(){ DOOR.volume=Math.max(0,DOOR.volume-0.08); if (DOOR.volume<=0){ clearInterval(DOOR._f); DOOR.pause(); } },50); } catch(e){} }
  function rdOpen(){ if (Date.now()<lockUntil) return true; try { var ok=!!(live && live.contentWindow.__rdOpen && live.contentWindow.__rdOpen()); if (ok) playDoor(); return ok; } catch(err){ return false; } }
  function onClick(e, w){ if (!started) return; if (e.clientX < (w||innerWidth)*0.2) show(cur-1); else { if (rdOpen()) return; if (cur<N-1) show(cur+1); } }

  addEventListener('click', function(e){ if (e.target.closest && (e.target.closest('#go')||e.target.closest('#again'))) return; onClick(e); });
  document.getElementById('go').addEventListener('click', function(e){ e.stopPropagation(); if (armed) begin(); else arm(); });
  document.getElementById('start').addEventListener('click', function(e){ if (armed && !(e.target.closest && e.target.closest('#go'))) begin(); });

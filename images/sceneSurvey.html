<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리캐치 설문</title>
<style>
:root{--o:#F98802;--od:#C45F00;--k:#141416}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--o);color:var(--k);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;word-break:keep-all}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 78% 50%,#ffb04d 0,rgba(255,176,77,0) 45%),linear-gradient(135deg,#ff9a1f,#F98802 45%,#e67700)}
.bg:after{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(20,20,22,.10) 1.4px,transparent 1.5px);background-size:3.2vh 3.2vh}
.wm{position:fixed;left:-4vh;bottom:-16vh;font-size:78vh;font-weight:900;line-height:1;color:rgba(20,20,22,.06);letter-spacing:-.06em;pointer-events:none}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:6vw;padding:0 8vw}
.eye{display:inline-flex;align-items:center;gap:1.2vh;font-size:2.1vh;font-weight:900;letter-spacing:.32em;color:var(--k);opacity:.0;transform:translateY(2vh)}
.eye i{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--k)}
.big{display:table;margin-top:1.8vh;font-size:6.4vh;font-weight:900;letter-spacing:-.02em;line-height:1;color:#fff;background:var(--k);border-radius:1.6vh;padding:1.4vh 2.6vh 1.6vh;opacity:0;transform:translateY(3vh)}
h1{margin-top:2.8vh;font-size:6.6vh;font-weight:900;line-height:1.08;letter-spacing:-.04em;opacity:0;transform:translateY(3vh)}
h1 span{color:#fff;-webkit-text-stroke:0}
.sub{margin-top:3vh;font-size:2.9vh;font-weight:600;line-height:1.55;color:rgba(20,20,22,.82);opacity:0;transform:translateY(3vh)}
.chips{margin-top:4.4vh;display:flex;gap:1.4vh;flex-wrap:wrap;opacity:0;transform:translateY(3vh)}
.chips b{display:inline-flex;align-items:center;gap:1vh;font-size:2.3vh;font-weight:800;background:var(--k);color:#fff;border-radius:99px;padding:1.3vh 2.4vh}
.chips b em{font-style:normal;color:var(--o)}
.thanks{margin-top:5vh;font-size:2.2vh;font-weight:800;color:rgba(20,20,22,.7);opacity:0}
.card{justify-self:center;position:relative;width:min(56vh,38vw);background:var(--k);border-radius:4.6vh;padding:4.2vh 4.2vh 3.6vh;box-shadow:0 5vh 10vh rgba(90,40,0,.35);transform:translateY(3vh) scale(.94);opacity:0}
.card .top{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:2.2vh;font-weight:900}
.card .top span{font-size:1.6vh;font-weight:800;letter-spacing:.2em;color:var(--o)}
.qbox{position:relative;margin-top:2.6vh;border-radius:2vh;overflow:hidden;background:#fff}
.qr{display:block;width:100%;height:auto}
.scan{position:absolute;left:0;right:0;height:18%;top:-20%;background:linear-gradient(180deg,rgba(249,136,2,0),rgba(249,136,2,.28) 70%,rgba(249,136,2,.85) 98%,rgba(249,136,2,0));mix-blend-mode:multiply}
.card .bot{margin-top:2.4vh;text-align:center;color:#fff;font-size:2.4vh;font-weight:900}
.card .bot small{display:block;margin-top:.8vh;font-size:1.7vh;font-weight:600;color:#a9a9b0}
.tag{position:absolute;right:-4.5vh;top:-6vh;width:12vh;height:12vh;border-radius:50%;background:#fff;color:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:3.6vh;line-height:1;box-shadow:0 2vh 4vh rgba(0,0,0,.25);transform:rotate(-8deg)}
.tag small{font-size:1.5vh;font-weight:800;margin-top:.6vh;color:var(--od)}
.go .eye,.go .big,.go h1,.go .sub,.go .chips{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);opacity:1;transform:none}
.go .big{transition-delay:.06s} .go h1{transition-delay:.12s} .go .sub{transition-delay:.24s} .go .chips{transition-delay:.36s}
.go .thanks{transition:opacity .8s 1.1s;opacity:1}
.go .card{transition:opacity .7s .2s,transform .9s .2s cubic-bezier(.2,1.3,.4,1);opacity:1;transform:none}
.go .scan{animation:scan 2.6s 1.2s ease-in-out infinite}
@keyframes scan{0%{top:-20%}60%,100%{top:105%}}
.go .tag{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-8deg) translateY(-1vh)}}
@media (prefers-reduced-motion:reduce){.go .scan,.go .tag{animation:none}}
</style></head><body>
